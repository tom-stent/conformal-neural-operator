[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-no"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "neuraloperator>=2.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["conformal_no*", "experiments*"]